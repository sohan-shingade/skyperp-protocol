<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Skyperp — perpetual futures on real-world data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f11"/>
      <stop offset="1" stop-color="#161620"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#2a2a32" stroke-width="1" opacity="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- anomaly sparkline: a mean-reverting temperature anomaly series -->
  <polyline fill="none" stroke="url(#fade)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
    points="0,205 60,170 120,198 180,140 240,176 300,120 360,150 420,96 480,138 540,108 600,158 660,120 720,182 780,150 840,196 900,164 960,206 1020,176 1080,214 1140,188 1200,212"/>
  <!-- zero-anomaly baseline -->
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2 8" opacity="0.35"/>

  <!-- wordmark -->
  <g transform="translate(72,150)">
    <text x="0" y="0" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="88" font-weight="700" letter-spacing="-3">
      <tspan fill="#f5f5f7">SKY</tspan><tspan fill="url(#amber)">PERP</tspan>
    </text>
    <text x="4" y="44" font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="20" letter-spacing="1" fill="#a1a1aa">
      perpetual futures on real-world data
    </text>
  </g>

  <!-- lightning glyph -->
  <path filter="url(#glow)" transform="translate(1044,86)" fill="url(#amber)"
    d="M44 0 L8 78 L40 78 L20 148 L84 56 L50 56 Z"/>

  <!-- status chips -->
  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,monospace" font-size="13" font-weight="500">
    <g transform="translate(76,250)">
      <rect width="162" height="26" rx="13" fill="#1a1a1f" stroke="#2a2a32"/>
      <circle cx="16" cy="13" r="4" fill="#22c55e"/>
      <text x="28" y="17" fill="#a1a1aa">Solana · Anchor</text>
    </g>
    <g transform="translate(250,250)">
      <rect width="138" height="26" rx="13" fill="#1a1a1f" stroke="#2a2a32"/>
      <circle cx="16" cy="13" r="4" fill="#f59e0b"/>
      <text x="28" y="17" fill="#a1a1aa">weather first</text>
    </g>
    <g transform="translate(400,250)">
      <rect width="120" height="26" rx="13" fill="#1a1a1f" stroke="#2a2a32"/>
      <circle cx="16" cy="13" r="4" fill="#f59e0b"/>
      <text x="28" y="17" fill="#a1a1aa">pre-launch</text>
    </g>
  </g>
</svg>
